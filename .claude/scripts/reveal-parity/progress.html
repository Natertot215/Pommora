<title>Hover Reveal Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f5f7f9;
    --panel: #ffffff;
    --ink: #17202a;
    --ink-2: #4c5866;
    --ink-3: #8390a0;
    --rule: #dde3ea;
    --accent: #2f7fd6;
    --ok: #1f8a58;
    --ok-fill: #e3f4ec;
    --run: #b87408;
    --run-fill: #fbf0dc;
    --stop: #c2412d;
    --stop-fill: #fae6e2;
    --idle-fill: #edf1f5;
    --font: "Figtree", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #11161c;
      --panel: #181f27;
      --ink: #e6ebf1;
      --ink-2: #aab5c2;
      --ink-3: #6f7c8b;
      --rule: #29333e;
      --accent: #6aaef2;
      --ok: #5cc995;
      --ok-fill: #17322a;
      --run: #e8a94a;
      --run-fill: #3a2c14;
      --stop: #f0806c;
      --stop-fill: #3d1f1a;
      --idle-fill: #222b35;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #11161c;
    --panel: #181f27;
    --ink: #e6ebf1;
    --ink-2: #aab5c2;
    --ink-3: #6f7c8b;
    --rule: #29333e;
    --accent: #6aaef2;
    --ok: #5cc995;
    --ok-fill: #17322a;
    --run: #e8a94a;
    --run-fill: #3a2c14;
    --stop: #f0806c;
    --stop-fill: #3d1f1a;
    --idle-fill: #222b35;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.55 var(--font);
    padding-inline: 16px;
    padding-block: 28px 48px;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: grid; gap: 6px; }
  .eyebrow { font: 500 12px/1 var(--mono); color: var(--ink-3); letter-spacing: 0.04em; }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
  .lede { margin: 0; color: var(--ink-2); max-width: 62ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font: 13px/1.4 var(--mono); color: var(--ink-2); }
  .meta b { color: var(--ink); font-weight: 500; }
  .state { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); }
  .state p { margin: 0; }
  h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .phases { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .phase { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 14px 16px; border-top: 1px solid var(--rule); }
  .phase:first-child { border-top: 0; }
  .phase .name { font-weight: 600; }
  .phase .detail { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 16px; font: 12.5px/1.5 var(--mono); color: var(--ink-2); }
  .phase .note { grid-column: 2; margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
  .pill { justify-self: start; align-self: start; font: 600 11px/1 var(--font); letter-spacing: 0.05em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
  .pill[data-s="done"] { color: var(--ok); background: var(--ok-fill); }
  .pill[data-s="running"] { color: var(--run); background: var(--run-fill); }
  .pill[data-s="stopped"] { color: var(--stop); background: var(--stop-fill); }
  .pill[data-s="pending"] { color: var(--ink-3); background: var(--idle-fill); }
  ul.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  ul.list li { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
  ul.list .empty { color: var(--ink-3); background: transparent; border-style: dashed; }
  code { font: 12.5px var(--mono); }
  footer { font: 12px/1.5 var(--mono); color: var(--ink-3); }
</style>

<main>
  <header>
    <span class="eyebrow">POMMORA · OVERNIGHT PLAN RUN</span>
    <h1>Hover Reveal</h1>
    <p class="lede">One kit home for every hover-, focus-, and proximity-revealed control, checked against a live CDP recording of the app after every phase.</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="state" id="state"></div>

  <section>
    <h2>Phases</h2>
    <div class="phases" id="phases"></div>
  </section>

  <section>
    <h2>Deviations</h2>
    <ul class="list" id="deviations"></ul>
  </section>

  <section>
    <h2>Open Items</h2>
    <ul class="list" id="open"></ul>
  </section>

  <footer id="updated"></footer>
</main>

<script type="application/json" id="progress">
{
  "updated": "2026-09-25 — plan ratified",
  "state": { "status": "pending", "text": "Ratified and committed. Waiting for the overnight session to start: tree check, gates, baseline." },
  "baseline": null,
  "start": null,
  "end": null,
  "phases": [
    { "name": "Start — tree check, gates, baseline", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null },
    { "name": "Phase 0 — Reveal Parity Harness and Baseline", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null },
    { "name": "Phase 1 — The Kit Home", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null },
    { "name": "Phase 2 — Kit Consumers and Their Hosts", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null },
    { "name": "Phase 3 — Shell, Tiles, and Views", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null },
    { "name": "Phase 4 — MarkdownPM", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null },
    { "name": "Final Verification", "status": "pending", "commit": null, "gates": null, "parity": null, "note": null }
  ],
  "deviations": [],
  "open": [
    "Touch policy for script hosts (off-state grips, table adds, the editing handle, the View Tile's peeked band) — for the mobile plan."
  ]
}
</script>

<script>
  const data = JSON.parse(document.getElementById('progress').textContent)
  const el = (tag, cls, text) => {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (text != null) n.textContent = text
    return n
  }
  const pill = (s) => {
    const p = el('span', 'pill', s)
    p.dataset.s = s
    return p
  }

  const meta = document.getElementById('meta')
  for (const [k, v] of [['baseline', data.baseline], ['start', data.start], ['end', data.end]]) {
    const s = el('span')
    s.append(k + ' ', Object.assign(el('b'), { textContent: v ?? '—' }))
    meta.append(s)
  }

  const state = document.getElementById('state')
  state.append(pill(data.state.status), el('p', null, data.state.text))

  const phases = document.getElementById('phases')
  for (const ph of data.phases) {
    const row = el('div', 'phase')
    row.append(pill(ph.status), el('span', 'name', ph.name))
    const d = el('div', 'detail')
    for (const [k, v] of [['commit', ph.commit], ['gates', ph.gates], ['parity', ph.parity]]) if (v) d.append(el('span', null, k + ' ' + v))
    if (d.childNodes.length) row.append(d)
    if (ph.note) row.append(el('p', 'note', ph.note))
    phases.append(row)
  }

  const list = (id, items, none) => {
    const ul = document.getElementById(id)
    if (!items.length) ul.append(el('li', 'empty', none))
    for (const t of items) ul.append(el('li', null, t))
  }
  list('deviations', data.deviations, 'None recorded.')
  list('open', data.open, 'None.')

  document.getElementById('updated').textContent = 'Updated ' + data.updated
</script>
