name: Clean Main

on:
  push:
    branches: [active]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-main
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: active
          fetch-depth: 0
      - run: pip install git-filter-repo
      - run: >
          git filter-repo --force --refs active --invert-paths
          --path .claude/ --path .github/ --path Dashboard/
          --path-regex '(?i)(^|/)[^/]*(testing|tests)/|\.(test|spec)\.[cm]?[jt]sx?$|(^|/)vitest\.(config|setup)\.[cm]?[jt]s$'
      - run: git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" active:main
